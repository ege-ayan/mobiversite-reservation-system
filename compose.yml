services:
  migrate:
    build: .
    image: mobiversite-reservation-system:local
    entrypoint: ['sh', '-c', 'npx prisma migrate deploy && node prisma/seed.mjs']
    environment:
      DATABASE_URL: mysql://mobiversite:mobiversite@mysql:3306/mobiversite
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mobiversite.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    image: mobiversite-reservation-system:local
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://mobiversite:mobiversite@mysql:3306/mobiversite
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-this-secret-now!}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mobiversite.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
      PAYMENT_SERVICE_URL: http://payment:4000
      PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET:-dev-only-webhook-secret-change-me!!}"
      RESERVATION_HOLD_MS: ${RESERVATION_HOLD_MS:-1800000}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_TTL_MS: ${AUTH_RATE_TTL_MS:-60000}
      RATE_LIMIT_STORE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      payment:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  payment:
    image: node:26-alpine
    working_dir: /app
    command: ['node', 'server.mjs']
    environment:
      PAYMENT_WEBHOOK_URL: http://api:3000/api/v1/webhooks/payments
      PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET:-dev-only-webhook-secret-change-me!!}"
    volumes:
      - ./mock-payment:/app:ro
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mobiversite
      MYSQL_USER: mobiversite
      MYSQL_PASSWORD: mobiversite
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
